
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORBITX | ZARYA</title>

<!-- 3D Earth -->
<script src="https://unpkg.com/globe.gl"></script>

<!-- Satellite orbital calculations -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/5.0.0/satellite.min.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #01040b;
    font-family: Arial, sans-serif;
    color: white;
}

/* Full-screen space */
#space {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
        radial-gradient(ellipse at center, #071426 0%, #020711 55%, #010309 100%);
}

/* Star layers */
.stars, .stars2, .stars3 {
    position: absolute;
    inset: -100%;
    width: 300%;
    height: 300%;
    pointer-events: none;
    background-repeat: repeat;
}

.stars {
    background-image:
        radial-gradient(2px 2px at 40px 60px, white 99%, transparent),
        radial-gradient(1px 1px at 150px 180px, #b7dfff 99%, transparent),
        radial-gradient(2px 2px at 280px 100px, white 99%, transparent),
        radial-gradient(1px 1px at 350px 250px, #8bbcff 99%, transparent);
    background-size: 400px 300px;
    animation: drift 150s linear infinite;
    opacity: 0.8;
}

.stars2 {
    background-image:
        radial-gradient(1px 1px at 80px 90px, white 99%, transparent),
        radial-gradient(2px 2px at 200px 220px, #d9efff 99%, transparent),
        radial-gradient(1px 1px at 320px 40px, white 99%, transparent);
    background-size: 350px 280px;
    animation: drift 220s linear infinite reverse;
    opacity: 0.6;
}

.stars3 {
    background-image:
        radial-gradient(1px 1px at 120px 160px, #5bbcff 99%, transparent),
        radial-gradient(1px 1px at 270px 270px, white 99%, transparent);
    background-size: 300px 320px;
    animation: twinkle 4s ease-in-out infinite alternate;
    opacity: 0.5;
}

@keyframes drift {
    from { transform: translate(0, 0); }
    to { transform: translate(-300px, -200px); }
}

@keyframes twinkle {
    from { opacity: 0.2; }
    to { opacity: 0.9; }
}

/* Earth container */
#globeViz {
    position: absolute;
    inset: 0;
    z-index: 2;
}

#globeViz canvas {
    display: block;
}

/* Top branding */
.topbar {
    position: absolute;
    z-index: 10;
    top: 28px;
    left: 35px;
    right: 35px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
}

.logo {
    font-size: 23px;
    font-weight: bold;
    letter-spacing: 6px;
    color: #51dfff;
    text-shadow: 0 0 15px #159dff;
}

.mission {
    font-size: 10px;
    letter-spacing: 3px;
    color: #9cb8d1;
}

.live {
    font-size: 11px;
    letter-spacing: 2px;
    color: #55ffb0;
}

/* Satellite information */
.info {
    position: absolute;
    z-index: 10;
    left: 35px;
    bottom: 35px;
    pointer-events: none;
}

.info h1 {
    font-size: clamp(24px, 4vw, 40px);
    letter-spacing: 3px;
    color: #e8f7ff;
    text-shadow: 0 0 25px #299fff;
}

.info p {
    font-size: 11px;
    letter-spacing: 2px;
    color: #83a9c5;
    margin-top: 10px;
}

.coordinates {
    margin-top: 20px;
    color: #4bdfff;
    font-size: 12px;
    line-height: 2;
}

/* Bottom right */
.bottom {
    position: absolute;
    z-index: 10;
    right: 35px;
    bottom: 35px;
    text-align: right;
    pointer-events: none;
}

.bottom .label {
    color: #6f94ae;
    font-size: 10px;
    letter-spacing: 3px;
}

.bottom .value {
    color: #d9f5ff;
    font-size: 17px;
    margin-top: 8px;
}

.orbit-status {
    color: #4cffad;
    font-size: 10px;
    letter-spacing: 2px;
    margin-top: 12px;
}

/* Loading */
#loading {
    position: absolute;
    z-index: 20;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #4bdfff;
    font-size: 12px;
    letter-spacing: 3px;
    text-align: center;
}

#loading span {
    display: block;
    margin-top: 12px;
    color: #7294aa;
    font-size: 10px;
}

@media(max-width:600px) {
    .topbar {
        left: 18px;
        right: 18px;
        top: 20px;
    }

    .logo { font-size: 18px; }

    .mission { display: none; }

    .info {
        left: 20px;
        bottom: 25px;
    }

    .bottom {
        right: 20px;
        bottom: 25px;
    }
}
</style>
</head>

<body>

<div id="space">

    <!-- Stars -->
    <div class="stars"></div>
    <div class="stars2"></div>
    <div class="stars3"></div>

    <!-- 3D Earth -->
    <div id="globeViz"></div>

    <!-- Header -->
    <div class="topbar">
        <div class="logo">ORBITX</div>
        <div class="mission">EARTH ORBITAL OPERATIONS</div>
        <div class="live">● LIVE MISSION</div>
    </div>

    <!-- Satellite information -->
    <div class="info">
        <h1>ISS ZARYA</h1>
        <p>INTERNATIONAL SPACE STATION</p>

        <div class="coordinates">
            <div id="latitude">LATITUDE : --</div>
            <div id="longitude">LONGITUDE : --</div>
            <div id="altitude">ALTITUDE : --</div>
        </div>
    </div>

    <!-- Orbital status -->
    <div class="bottom">
        <div class="label">ORBITAL STATUS</div>
        <div class="value">LOW EARTH ORBIT</div>
        <div class="orbit-status">● SGP4 PROPAGATION ACTIVE</div>
    </div>

    <div id="loading">
        INITIALIZING ORBITX
        <span>LOADING EARTH AND ORBITAL DATA...</span>
    </div>

</div>

<script>

/* =====================================
   ORBITX - ISS ZARYA VISUALIZATION
===================================== */

const TLE_URL =
"https://celestrak.org/NORAD/elements/gp.php?CATNR=25544&FORMAT=TLE";

let globe;
let satelliteRecord = null;
let orbitPoints = [];
let lastPosition = null;
let updateTimer = null;


/* =====================================
   CREATE 3D EARTH
===================================== */

function createEarth() {

    const container = document.getElementById("globeViz");

    if (typeof Globe !== "function") {
        document.getElementById("loading").innerHTML =
            "GLOBE LIBRARY FAILED TO LOAD";
        return;
    }

    globe = Globe()(container)

        .globeImageUrl(
            "https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg"
        )

        .bumpImageUrl(
            "https://unpkg.com/three-globe/example/img/earth-topology.png"
        )

        .backgroundColor("rgba(0,0,0,0)")

        .showAtmosphere(true)

        .atmosphereColor("#38aaff")

        .atmosphereAltitude(0.20)

        .showGraticules(false)

        .width(container.clientWidth)
        .height(container.clientHeight)

        /* ISS marker */
        .pointsData([])
        .pointLat(d => d.lat)
        .pointLng(d => d.lng)
        .pointAltitude(0.10)
        .pointColor(() => "#ff3c72")
        .pointRadius(0.65)

        /* Orbit path */
        .pathsData([])
        .pathPoints(d => d.points)
        .pathPointLat(p => p.lat)
        .pathPointLng(p => p.lng)
        .pathPointAlt(p => p.alt)
        .pathColor(() => "#35cfff")
        .pathStroke(1.5)

        /* Satellite marker glow */
        .ringsData([])
        .ringLat(d => d.lat)
        .ringLng(d => d.lng)
        .ringColor(() => t => `rgba(255,65,110,${1-t})`)
        .ringMaxRadius(4)
        .ringPropagationSpeed(2)
        .ringRepeatPeriod(1200);

    /* Earth rotation */
    const controls = globe.controls();

    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.35;
    controls.enableZoom = true;
    controls.enablePan = false;

    globe.pointOfView(
        { lat: 15, lng: 0, altitude: 2.5 },
        1500
    );

    document.getElementById("loading").style.display = "none";

    window.addEventListener("resize", () => {
        globe.width(container.clientWidth);
        globe.height(container.clientHeight);
    });
}


/* =====================================
   LOAD REAL ISS ORBITAL DATA
===================================== */

async function loadTLE() {

    try {

        const response = await fetch(TLE_URL);

        if (!response.ok) {
            throw new Error("TLE service unavailable");
        }

        const tle = await response.text();

        const lines = tle.trim().split(/\r?\n/);

        const line1 = lines.find(line => line.startsWith("1 "));
        const line2 = lines.find(line => line.startsWith("2 "));

        if (!line1 || !line2) {
            throw new Error("Invalid orbital elements");
        }

        satelliteRecord = satellite.twoline2satrec(
            line1,
            line2
        );

        console.log("ISS ZARYA orbital elements loaded");

        generateOrbit();

        updateSatellite();

        updateTimer = setInterval(updateSatellite, 1000);

    } catch(error) {

        console.error("TLE ERROR:", error);

        document.getElementById("loading").style.display = "block";

        document.getElementById("loading").innerHTML =
            "ORBITAL DATA UNAVAILABLE" +
            "<span>CHECK INTERNET CONNECTION AND REFRESH</span>";
    }
}


/* =====================================
   CALCULATE SATELLITE POSITION
===================================== */

function getPosition(date) {

    if (!satelliteRecord) return null;

    const result = satellite.propagate(
        satelliteRecord,
        date
    );

    if (!result.position ||
        typeof result.position === "boolean") {
        return null;
    }

    const gmst = satellite.gstime(date);

    const geo = satellite.eciToGeodetic(
        result.position,
        gmst
    );

    return {

        lat: satellite.degreesLat(geo.latitude),

        lng: satellite.degreesLong(geo.longitude),

        alt: geo.height

    };
}


/* =====================================
   GENERATE ORBITAL PATH
===================================== */

function generateOrbit() {

    if (!satelliteRecord) return;

    orbitPoints = [];

    const now = Date.now();

    /*
      Generate a 100-minute predicted ground track.
      Each point is calculated using SGP4.
    */

    for (let minutes = -45; minutes <= 60; minutes += 1) {

        const date = new Date(
            now + minutes * 60000
        );

        const position = getPosition(date);

        if (position) {

            orbitPoints.push({

                lat: position.lat,

                lng: position.lng,

                alt: 0.12

            });

        }
    }

    if (globe && orbitPoints.length > 1) {

        globe.pathsData([
            {
                points: orbitPoints
            }
        ]);

    }

    console.log("ISS orbital trajectory generated");
}


/* =====================================
   UPDATE ISS POSITION
===================================== */

function updateSatellite() {

    const position = getPosition(new Date());

    if (!position || !globe) return;

    lastPosition = position;

    /* Update satellite marker */

    globe.pointsData([
        {
            lat: position.lat,
            lng: position.lng
        }
    ]);

    /* Update red glow */

    globe.ringsData([
        {
            lat: position.lat,
            lng: position.lng
        }
    ]);

    /* Update coordinates */

    document.getElementById("latitude").textContent =
        "LATITUDE : " + position.lat.toFixed(3) + "°";

    document.getElementById("longitude").textContent =
        "LONGITUDE : " + position.lng.toFixed(3) + "°";

    document.getElementById("altitude").textContent =
        "ALTITUDE : " + position.alt.toFixed(2) + " KM";

    /*
      Refresh predicted orbit periodically.
      This keeps the path aligned with updated TLE time.
    */

    if (Date.now() % 60000 < 1200) {
        generateOrbit();
    }

}


/* =====================================
   START ORBITX
===================================== */

async function startORBITX() {

    createEarth();

    await loadTLE();

}

startORBITX();

</script>

</body>
</html>
